name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            packages/*/dist
            packages/*/*.tsbuildinfo
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'packages/**/*.ts', 'packages/**/tsconfig*.json', 'packages/**/package.json') }}
      - run: pnpm typecheck
      - run: pnpm toolchain:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-build
          path: packages/*/dist
          retention-days: 7
          if-no-files-found: error

  quality:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-build
          path: packages
      - run: pnpm lint
      - run: pnpm foundation:check
      - run: pnpm foundation:assert-dev-only
      - run: pnpm foundation:assert-registry
      - run: pnpm test:boundaries
      - run: pnpm test:packed
      - run: pnpm release:dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run
          path: .artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  scenarios:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24.21.0, 26.11.1]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: payments
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d payments"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/payments
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-build
          path: packages
      - run: pnpm test:core
      - name: Qualify exact Drizzle artifact and strict declarations
        run: pnpm test:drizzle:admission
      - run: pnpm test:paddle
      - run: pnpm test:modular
      - run: pnpm test:postgres
      - run: pnpm test:e2e
      - name: Qualify published observation consumer
        run: pnpm test:observation
      - name: Qualify production npm consumer and durable financial scenario
        run: pnpm test:packed:npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-consumer-qualification-node-${{ matrix.node }}
          path: |
            .artifacts/observation-published-node-*.json
            .artifacts/observation-published-node-*.log
            .artifacts/drizzle-admission-node-*.json
            .artifacts/packed-npm-node-*
            .artifacts/packed-queue-node-*
            .artifacts/packed-postgres-root-node-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required checks
    if: always()
    needs: [build, quality, scenarios]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every prerequisite
        env:
          BUILD: ${{ needs.build.result }}
          QUALITY: ${{ needs.quality.result }}
          SCENARIOS: ${{ needs.scenarios.result }}
        run: |
          test "$BUILD" = success
          test "$QUALITY" = success
          test "$SCENARIOS" = success
