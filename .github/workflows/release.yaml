name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Explicit version tag matching all four manifests, for example v0.3.0'
        type: string
        required: true
      commit:
        description: 'Full lowercase 40-character main commit SHA with successful main-push Checks'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'agent-teams-ai/payments-sdk' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      run_id: ${{ steps.verify.outputs.run_id }}
    steps:
      # Release tools are read from trusted main; target packages come from the exact successful CI run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; exact pnpm from packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install frozen release tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Admit exact main commit and successful required CI
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
        run: node tools/release-candidate.ts verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dry-run
          path: .artifacts/ci
          run-id: ${{ steps.verify.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Re-audit versioned archives and write checksums/provenance
        env:
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.verify.outputs.commit }}
          CHECKS_RUN_ID: ${{ steps.verify.outputs.run_id }}
        run: node tools/release-candidate.ts assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payments-${{ steps.verify.outputs.tag }}-${{ steps.verify.outputs.commit }}
          path: .artifacts/release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  release:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; exact pnpm from packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install frozen release tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: payments-${{ needs.candidate.outputs.tag }}-${{ needs.candidate.outputs.commit }}
          path: .artifacts/release
      - name: Publish immutable GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: node tools/release-candidate.ts publish
